# ResearchOS AI — Model Configuration & Role Assignments
# Stage 4: AI Intelligence Engine Foundation
# Default execution mode: Local CPU inference via Ollama (Zero paid API dependency)

version: "1.0.0"
cloud_enabled: false

providers:
  ollama:
    base_url: "http://127.0.0.1:11434"
    timeout_seconds: 60.0
    connect_timeout_seconds: 5.0
    max_retries: 2
    thread_limit: 4
    keep_alive: "5m"

roles:
  fast_router:
    provider: "ollama"
    model: "qwen2.5:1.5b-instruct-q4_K_M"
    fallback_model: null
    context_window: 2048
    temperature: 0.1
    max_tokens: 512

  tool_caller:
    provider: "ollama"
    model: "llama3.2:3b-instruct-q4_K_M"
    fallback_model: "qwen2.5:1.5b-instruct-q4_K_M"
    context_window: 4096
    temperature: 0.2
    max_tokens: 1024

  fast_chat:
    provider: "ollama"
    model: "qwen2.5:3b-instruct-q4_K_M"
    fallback_model: "qwen2.5:1.5b-instruct-q4_K_M"
    context_window: 4096
    temperature: 0.7
    max_tokens: 2048

  deep_reasoning:
    provider: "ollama"
    model: "qwen2.5:7b-instruct-q4_K_M"
    fallback_model: "qwen2.5:3b-instruct-q4_K_M"
    context_window: 4096
    temperature: 0.4
    max_tokens: 2048
